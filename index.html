<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人作品集</title>
<meta name="description" content="初中信息技术教师个人作品集：教学课件、Scratch 作品与编程项目">
<style>
  :root{
    --bg:#ffffff;
    --surface:#f6f7f9;
    --text:#1b1f24;
    --muted:#5b6470;
    --line:#e6e8ec;
    --accent:#2f5fe0;
    --accent-soft:#eef2ff;
    --wrap:1080px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    color:var(--text);background:var(--bg);line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  img{display:block;max-width:100%}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}

  /* nav */
  .nav{
    position:sticky;top:0;z-index:20;
    background:rgba(255,255,255,.9);
    border-bottom:1px solid var(--line);
    backdrop-filter:saturate(180%) blur(10px);
  }
  .nav-inner{height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .brand{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .nav-links{display:flex;gap:24px;font-size:14px;color:var(--muted);white-space:nowrap}
  .nav-links a:hover{color:var(--accent)}

  /* hero */
  .hero{padding:76px 0 68px}
  /* 始终左右并排：文字在左，照片在右（窄屏只缩小照片，不堆叠） */
  .hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 232px;gap:48px;align-items:center}
  .badge{
    display:inline-block;font-size:13px;color:var(--accent);
    background:var(--accent-soft);border-radius:999px;padding:5px 14px;margin-bottom:20px;
  }
  .hero h1{font-size:40px;line-height:1.25;font-weight:600;letter-spacing:-.02em}
  .hero .tagline{font-size:19px;color:var(--muted);margin-top:12px}
  .hero .intro{font-size:15px;color:var(--muted);margin-top:20px;max-width:620px}
  .btn-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
  .btn{
    display:inline-block;font-size:14px;padding:11px 22px;border-radius:10px;
    border:1px solid transparent;transition:.18s ease;
  }
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:#2450c4}
  .btn-ghost{border-color:var(--line);color:var(--text);background:#fff}
  .btn-ghost:hover{border-color:#c3cee8;color:var(--accent)}
  .avatar{
    width:232px;height:232px;border-radius:18px;overflow:hidden;
    border:1px solid var(--line);background:var(--surface);
    display:flex;align-items:center;justify-content:center;
  }
  .avatar img{width:100%;height:100%;object-fit:cover}

  /* section */
  .sec{padding:68px 0;border-top:1px solid var(--line)}
  .eyebrow{font-size:12px;letter-spacing:.1em;color:var(--accent);margin-bottom:8px}
  .sec h2{font-size:28px;font-weight:600;letter-spacing:-.01em}
  .sec-desc{color:var(--muted);margin-top:10px;max-width:660px;font-size:15px}
  .sec-body{margin-top:34px}

  /* about */
  .about-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:52px}
  .about-text p{color:var(--muted);font-size:15px}
  .about-text p + p{margin-top:14px}
  .facts{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .fact{background:#fff;padding:14px 16px}
  .fact .k{font-size:12px;color:var(--muted)}
  .fact .v{font-size:14px;margin-top:3px}
  .skill + .skill{margin-top:16px}
  .skill-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:7px}
  .skill-row span:last-child{color:var(--muted);font-size:13px}
  .bar{height:6px;border-radius:999px;background:#eef0f4;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}

  /* cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(306px,1fr));gap:20px}
  .card{
    border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;
    display:flex;flex-direction:column;transition:.2s ease;
  }
  .card:hover{border-color:#c9d5f2;box-shadow:0 8px 24px rgba(24,42,89,.07)}
  .cover{
    aspect-ratio:16/10;background:var(--surface);
    display:flex;align-items:center;justify-content:center;padding:16px;
    border-bottom:1px solid var(--line);
  }
  .cover img{width:100%;height:100%;object-fit:cover;border-radius:8px}
  .card-body{padding:18px 18px 20px;display:flex;flex-direction:column;flex:1}
  .card-body h3{font-size:16px;font-weight:600;line-height:1.5}
  .card-body .tag{
    align-self:flex-start;font-size:12px;color:var(--accent);
    background:var(--accent-soft);border-radius:6px;padding:2px 8px;margin-top:8px;
  }
  .card-body p{font-size:14px;color:var(--muted);margin-top:12px}
  .thumb-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .thumb-row img{width:64px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
  .links{display:flex;flex-wrap:wrap;gap:16px;margin-top:auto;padding-top:16px;font-size:13px}
  .links a{color:var(--accent);border-bottom:1px solid transparent}
  .links a:hover{border-bottom-color:currentColor}

  /* placeholder */
  .ph{
    font-size:12px;color:#8b93a0;text-align:center;line-height:1.7;
    border:1px dashed #ccd3dd;border-radius:10px;padding:12px 16px;background:#fff;
  }
  .ph code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--accent)}

  /* embed */
  .embed-box{border-bottom:1px solid var(--line);background:var(--surface);padding:14px}
  .embed-box iframe{width:100%;aspect-ratio:4/3;border:0;border-radius:10px;background:#fff}

  /* resume + contact */
  .resume-box{
    border:1px solid var(--line);border-radius:16px;padding:36px;background:var(--surface);
    display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
  }
  .resume-box h3{font-size:20px;font-weight:600}
  .resume-box p{color:var(--muted);font-size:14px;margin-top:6px;max-width:620px}
  .tip{
    font-size:12px;color:#8b93a0;margin-top:12px;
    border-left:3px solid var(--line);padding-left:10px;
  }
  .contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
  .contact-item{border:1px solid var(--line);border-radius:12px;padding:18px}
  .contact-item .k{font-size:12px;color:var(--muted)}
  .contact-item .v{font-size:15px;margin-top:4px;word-break:break-all}
  a.contact-item:hover{border-color:#c9d5f2}
  a.contact-item:hover .v{color:var(--accent)}
  footer{padding:32px 0;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}

  /* embed */
  .embed-big iframe{
    width:100%;height:68vh;min-height:420px;border:1px solid var(--line);
    border-radius:12px;background:#fff;display:block;
  }
  .modal-foot{
    display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;
    padding-top:14px;border-top:1px solid var(--line);font-size:13px;
  }
  .modal-foot a{color:var(--accent);border-bottom:1px solid transparent}
  .modal-foot a:hover{border-bottom-color:currentColor}

  /* modal */
  .modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px}
  .modal[hidden]{display:none}
  .modal-mask{position:absolute;inset:0;background:rgba(16,22,34,.5)}
  .modal-panel{
    position:relative;background:#fff;border-radius:16px;border:0.5px solid var(--line);
    width:100%;max-width:640px;max-height:82vh;overflow:auto;padding:28px 28px 24px;
  }
  .modal-close{
    position:absolute;top:12px;right:14px;font-size:22px;line-height:1;
    color:var(--muted);background:none;border:0;cursor:pointer;padding:4px 9px;border-radius:8px;
  }
  .modal-close:hover{background:var(--surface);color:var(--text)}
  .modal-panel h3{font-size:20px;font-weight:600}
  .modal-tag{
    display:inline-block;font-size:12px;color:var(--accent);
    background:var(--accent-soft);border-radius:6px;padding:2px 8px;margin-bottom:10px;
  }
  .modal-desc{font-size:14px;color:var(--muted);margin-top:8px}
  .file-list{list-style:none;margin-top:18px;display:flex;flex-direction:column;gap:10px}
  .file-item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .file-item .fname{font-size:14px;flex:1;min-width:0;word-break:break-all}
  .file-item .fnote{font-size:12px;color:var(--muted);white-space:nowrap}
  .file-item .fdown{font-size:13px;color:var(--accent);white-space:nowrap;border-bottom:1px solid transparent}
  .file-item .fdown:hover{border-bottom-color:currentColor}
  .file-item .fnod{font-size:12px;color:#8b93a0;white-space:nowrap}
  .file-item.empty{border-style:dashed;color:#8b93a0;font-size:13px;justify-content:center}
  .file-group + .file-group{margin-top:22px}
  .file-group h4{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;gap:8px;align-items:baseline}
  .file-group h4 span{font-size:12px;font-weight:400;color:var(--muted)}
  .card.clickable{cursor:pointer}
  .card.featured .cover{background:var(--accent-soft)}
  .card .hint{
    margin-top:auto;padding-top:14px;border-top:1px solid var(--line);
    font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .card .hint .go{color:var(--accent)}
  .card .hint .cnt{color:var(--muted);font-size:12px;white-space:nowrap}
  .card .hint.muted .go{color:#8b93a0}

  @media (max-width:860px){
    /* 注意：hero 保持左右并排，只把照片缩小 */
    .hero-grid{grid-template-columns:minmax(0,1fr) 150px;gap:26px}
    .avatar{width:150px;height:150px}
    .about-grid{grid-template-columns:1fr;gap:32px}
  }
  @media (max-width:680px){
    .nav-links{overflow-x:auto;gap:16px}
    .nav-inner{height:56px}
    .hero{padding:52px 0 48px}
    .hero h1{font-size:28px}
    .hero .intro{font-size:14px}
    .hero-grid{grid-template-columns:minmax(0,1fr) 120px;gap:18px}
    .avatar{width:120px;height:120px}
    .btn{padding:9px 16px;font-size:13px}
    .btn-row{gap:9px;margin-top:22px}
    .hero .tagline{font-size:17px}
    .sec{padding:52px 0}
    .sec h2{font-size:24px}
    .facts{grid-template-columns:1fr}
    .resume-box{padding:26px}
  }
  @media (max-width:640px){
    /* 只有手机等超窄屏才改为上下堆叠 */
    .hero-grid{grid-template-columns:1fr;gap:22px}
    .avatar{width:132px;height:132px}
  }
</style>
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <div class="brand" id="brand"></div>
    <nav class="nav-links" id="navlinks"></nav>
  </div>
</header>

<main>
  <section class="hero"><div class="wrap hero-grid" id="hero"></div></section>
  <section class="sec" id="about"><div class="wrap">
    <div class="eyebrow"></div><h2></h2><div class="sec-desc"></div>
    <div class="sec-body about-grid" id="aboutBody"></div>
  </div></section>
  <section class="sec" id="teaching"><div class="wrap">
    <div class="eyebrow"></div><h2></h2><div class="sec-desc"></div>
    <div class="sec-body grid" id="teachingBody"></div>
  </div></section>
  <section class="sec" id="coding"><div class="wrap">
    <div class="eyebrow"></div><h2></h2><div class="sec-desc"></div>
    <div class="sec-body grid" id="codingBody"></div>
  </div></section>
  <section class="sec" id="opensource"><div class="wrap">
    <div class="eyebrow"></div><h2></h2><div class="sec-desc"></div>
    <div class="sec-body grid" id="opensourceBody"></div>
    <div class="sec-body tip" id="githubTip"></div>
  </div></section>
  <section class="sec" id="resume"><div class="wrap"><div class="resume-box" id="resumeBox"></div></div></section>
  <section class="sec" id="contact"><div class="wrap">
    <div class="eyebrow"></div><h2></h2><div class="sec-desc"></div>
    <div class="sec-body contact-grid" id="contactBody"></div>
  </div></section>
</main>

<footer><div class="wrap" id="footer"></div></footer>

<div class="modal" id="modal" hidden>
  <div class="modal-mask" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" data-close aria-label="关闭">&times;</button>
    <div class="modal-tag" id="modalTag"></div>
    <h3 id="modalTitle"></h3>
    <p class="modal-desc" id="modalDesc"></p>
    <div id="modalFiles"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
